<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pink Theme Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Visitor Timer -->
    <div class="visit-time" id="visitTime">เวลาบนหน้าเว็บ: 00:00</div>

    <!-- Glass Navbar -->
    <nav class="navbar" id="navbar">
        <div class="logo">SoftPink UI</div>
        <ul class="nav-menu" id="navMenu">
            <li><a href="#" class="nav-link active">หน้าแรก</a></li>
            <li><a href="#" class="nav-link">ฟีเจอร์</a></li>
            <li><a href="#" class="nav-link">ผลงาน</a></li>
            <li><a href="#" class="nav-link">ติดต่อ</a></li>
        </ul>
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    </nav>

    <!-- Content Container -->
    <main class="container">
        <h1 style="margin-bottom: 20px;" class="copyable" title="คลิกเพื่อคัดลอก">ลองคลิกข้อความนี้เพื่อคัดลอก! ✨</h1>

        <div class="cards-grid">
            <!-- 3D Card 1 -->
            <div class="hobby-card">
                <div class="hobby-icon-wrapper">🎨</div>
                <h3 class="card-number">01. UI Design</h3>
                <p>การ์ดนี้มีเอฟเฟกต์ 3D Tilt และแสงออร่าโทนชมพูเมื่อวางเมาส์เหนือการ์ด</p>
                <img src="https://picsum.photos/400/250?random=1" alt="Demo Image">
            </div>

            <!-- 3D Card 2 -->
            <div class="hobby-card">
                <div class="hobby-icon-wrapper">💻</div>
                <h3 class="card-number">02. Frontend Interactive</h3>
                <p>ทดสอบปุ่ม Magnetic ที่จะขยับตามการเคลื่อนที่ของเมาส์อย่างนุ่มนวล</p>
                <button class="magnetic-btn magnetic">Magnetic Button</button>
            </div>
        </div>
    </main>

    <!-- Floating Controls -->
    <div class="floating-controls">
        <button class="float-btn" id="colorToggleBtn" title="เปลี่ยนธีมสี">🎨</button>
    </div>

    <!-- Floating Color Panel -->
    <div class="color-panel" id="colorPanel">
        <div class="color-dot" style="background: #ff4081;" data-color="#ff4081"></div>
        <div class="color-dot" style="background: #9c27b0;" data-color="#9c27b0"></div>
        <div class="color-dot" style="background: #00c6ff;" data-color="#00c6ff"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
